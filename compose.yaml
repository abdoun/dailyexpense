services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dailyexpense-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:8081:80"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stack
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dailyexpense

  db:
    image: mysql:8.4
    container_name: dailyexpense-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dailyexpense_mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" || exit 1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - dailyexpense

networks:
  dailyexpense:
    driver: bridge

volumes:
  dailyexpense_mysql:
