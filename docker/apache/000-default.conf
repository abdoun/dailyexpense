
<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html/public_html

    <Directory /var/www/html/public_html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dailyexpense-error.log
    CustomLog ${APACHE_LOG_DIR}/dailyexpense-access.log combined
</VirtualHost>
